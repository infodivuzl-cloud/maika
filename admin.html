<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maika Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#606212">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root { --ink: #606212; --ink-dark: #4A4B0E; --gold: #EDD03A; --gold-soft: #F6E7A6; --paper: #FFFBEA; --card: #FFFDF5; --line: rgba(96, 98, 18, .22); --muted: #6B6C3A; --red: #A3261B; --ok: #2F6B4F; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink-dark); font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 9px; background: var(--card); color: var(--ink-dark); font-weight: 700; font-size: 14px; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--gold-soft); }
  .btn--primary { background: var(--ink); color: var(--paper); }
  .btn--primary:hover { background: var(--ink-dark); }
  .btn--gold { background: var(--gold); border-color: var(--gold); }
  .btn--danger { border-color: var(--red); color: var(--red); }
  .btn--danger:hover { background: rgba(163, 38, 27, .08); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* login */
  .login { min-height: 100svh; display: grid; place-items: center; padding: 24px; background: var(--ink); }
  .login form { width: min(380px, 100%); padding: 32px 28px; border-radius: 18px; background: var(--paper); }
  .login h1 { margin: 0 0 4px; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 34px; }
  .login p { margin: 0 0 20px; color: var(--muted); }
  .login label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
  .login input { width: 100%; height: 46px; padding: 0 12px; border: 1.5px solid var(--ink); border-radius: 9px; background: var(--card); font-size: 16px; }
  .login .btn { width: 100%; margin-top: 16px; min-height: 48px; }
  .msg { margin: 12px 0 0; font-size: 14px; font-weight: 600; color: var(--red); }
  .msg:empty { display: none; }

  /* app shell */
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px; background: var(--ink); color: var(--gold); }
  .top h1 { margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 26px; line-height: 1; display: flex; align-items: center; gap: 10px; }
  .mk-logo { width: 96px; height: auto; display: block; }
  .login h1 { display: flex; align-items: flex-end; gap: 10px; color: var(--ink); }
  .mk-logo--login { width: 130px; }
  .badge { padding: 3px 9px; border-radius: 999px; background: var(--gold); color: var(--ink-dark); font-family: 'Figtree', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .badge--test { background: #F3A9DD; }
  .top .btn { min-height: 36px; border-color: var(--gold); background: transparent; color: var(--gold); }
  .top .btn:hover { background: rgba(237, 208, 58, .14); }
  .top-actions { display: flex; gap: 8px; }
  main { max-width: 1240px; margin: 0 auto; padding: 22px 24px 60px; }
  .updated { margin: 0 0 14px; font-size: 13px; color: var(--muted); }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
  .kpi { padding: 16px 18px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); }
  .kpi small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .kpi strong { display: block; margin-top: 4px; font-size: 26px; font-weight: 800; line-height: 1.1; }
  .kpi span { font-size: 13px; color: var(--muted); }
  .kpi--open { background: var(--gold); border-color: var(--gold); }
  .kpi--open small, .kpi--open span { color: var(--ink-dark); }

  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab { min-height: 36px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--card); font-size: 14px; font-weight: 700; cursor: pointer; }
  .tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .tab b { margin-left: 4px; font-weight: 800; opacity: .75; }
  .tools { display: flex; gap: 8px; }
  .tools input { height: 40px; width: 240px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--card); font-size: 15px; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; }
  th { padding: 10px 12px; background: var(--gold-soft); text-align: left; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
  td { padding: 12px; border-top: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  tbody tr { cursor: pointer; }
  @media (hover: hover) { tbody tr:hover td { background: rgba(237, 208, 58, .12); } }
  td .sub { display: block; font-size: 12px; color: var(--muted); }
  .amt { font-weight: 800; white-space: nowrap; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .st-new { background: var(--gold); } .st-packed { background: #F8D78F; } .st-dispatched { background: #CCE9FF; }
  .st-delivered { background: #CDE8D6; color: var(--ok); } .st-cancelled, .st-refunded { background: #F6D5D1; color: var(--red); }
  .st-unpaid { background: #EEE; color: #555; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); background: var(--card); border: 1.5px dashed var(--line); border-radius: 14px; }
  .note { margin-top: 26px; padding: 14px 16px; border-radius: 12px; background: var(--gold-soft); font-size: 14px; }
  .prices { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .prices div { padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); font-size: 14px; }
  .prices b { display: block; font-size: 18px; }

  /* order detail drawer */
  .shade { position: fixed; inset: 0; z-index: 20; background: rgba(30, 31, 4, .45); }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; width: min(520px, 100%); overflow-y: auto; background: var(--paper); box-shadow: -10px 0 40px rgba(30, 31, 4, .25); }
  .drawer header { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; background: var(--ink); color: var(--gold); }
  .drawer header h2 { margin: 0; font-size: 18px; }
  .drawer header .btn { min-height: 34px; border-color: var(--gold); background: transparent; color: var(--gold); }
  .drawer section { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .drawer h3 { margin: 0 0 8px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .statusbtns .btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .track { display: flex; gap: 8px; margin-top: 10px; }
  .track input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--card); font-size: 15px; }
  .toast { position: fixed; left: 50%; bottom: 22px; z-index: 30; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: var(--ink-dark); color: var(--paper); font-weight: 700; font-size: 14px; }

  @media (max-width: 899px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tools input { width: 100%; }
    .tools { width: 100%; }
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }
    table { border: 0; background: none; }
    tbody tr { margin-bottom: 10px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
    td { padding: 0; border: 0; }
    td.c-items { grid-column: 1 / -1; }
  }
  @media (max-width: 599px) {
    .top { padding: 10px 14px; } .top h1 { font-size: 21px; white-space: nowrap; gap: 6px; }
    .top .btn { padding: 0 10px; font-size: 13px; }
    .prices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    main { padding: 16px 14px 48px; }
    .kpi strong { font-size: 22px; }
    .kv { grid-template-columns: 90px 1fr; }
  }
</style>
</head>

<script>
(function () {
  var API = '/api/admin?action=';
  var state = { orders: [], products: {}, delivery: {}, tab: 'todo', q: '' };
  var TABS = [
    ['todo', 'To do'], ['dispatched', 'Dispatched'], ['delivered', 'Delivered'], ['cancelled', 'Cancelled / refunded'], ['unpaid', 'Unpaid'], ['all', 'All']
  ];
  var LABEL = { new: 'New', packed: 'Packed', dispatched: 'Dispatched', delivered: 'Delivered', cancelled: 'Cancelled', refunded: 'Refunded', unpaid: 'Unpaid' };
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function inr(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
  function when(sec) { return new Date(sec * 1000).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); }
  function toast(t) { var x = $('toast'); x.textContent = t; x.hidden = false; clearTimeout(x._t); x._t = setTimeout(function () { x.hidden = true; }, 2600); }
  function call(action, opts) {
    opts = opts || {};
    return fetch(API + action, { method: opts.body ? 'POST' : 'GET', credentials: 'same-origin', headers: opts.body ? { 'Content-Type': 'application/json', 'X-Maika-Admin': '1' } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (r.status === 401 && action !== 'login') { showLogin(); } if (!r.ok) throw new Error(d.error || 'Something went wrong.'); return d; }); });
  }

  /* status of an order for the panel */
  function payOf(o) { return o.payments.filter(function (p) { return p.status === 'captured' || p.status === 'authorized' || p.status === 'refunded'; })[0] || o.payments[0] || null; }
  function statusOf(o) {
    var p = payOf(o);
    if (o.status !== 'paid' && !(p && (p.status === 'captured' || p.status === 'authorized'))) return 'unpaid';
    if (p && p.refunded > 0 && p.refunded >= p.amount) return 'refunded';
    return o.notes.fulfil || 'new';
  }
  function inTab(o, tab) {
    var s = statusOf(o);
    if (tab === 'all') return true;
    if (tab === 'todo') return s === 'new' || s === 'packed';
    if (tab === 'cancelled') return s === 'cancelled' || s === 'refunded';
    return s === tab;
  }
  function matches(o, q) {
    if (!q) return true;
    var n = o.notes;
    return [o.id, n.customer, n.phone, n.email, n.items, n.address].join(' ').toLowerCase().indexOf(q) >= 0;
  }

  function renderKpis() {
    var now = Date.now() / 1000, day = 86400;
    var istMidnight = (function () { var d = new Date(Date.now() + 5.5 * 3600e3); d.setUTCHours(0, 0, 0, 0); return d.getTime() / 1000 - 5.5 * 3600; })();
    var paid = state.orders.filter(function (o) { var s = statusOf(o); return s !== 'unpaid' && s !== 'refunded' && s !== 'cancelled'; });
    function sum(from) { var l = paid.filter(function (o) { return o.created >= from; }); return [l.reduce(function (t, o) { return t + (o.paid || o.amount); }, 0), l.length]; }
    var t = sum(istMidnight), w = sum(now - 7 * day), m = sum(now - 30 * day);
    var open = state.orders.filter(function (o) { return inTab(o, 'todo'); }).length;
    var k = $('kpis'); k.textContent = '';
    [['Today', t], ['Last 7 days', w], ['Last 30 days', m]].forEach(function (x) {
      var d = el('div', 'kpi'); d.appendChild(el('small', null, x[0])); d.appendChild(el('strong', null, inr(x[1][0])));
      d.appendChild(el('span', null, x[1][1] + (x[1][1] === 1 ? ' order' : ' orders'))); k.appendChild(d);
    });
    var d = el('div', 'kpi kpi--open'); d.appendChild(el('small', null, 'To pack & send')); d.appendChild(el('strong', null, String(open))); d.appendChild(el('span', null, 'paid, not yet dispatched')); k.appendChild(d);
  }
  function renderTabs() {
    var t = $('tabs'); t.textContent = '';
    TABS.forEach(function (x) {
      var b = el('button', 'tab', x[1]); b.type = 'button'; b.setAttribute('aria-pressed', state.tab === x[0] ? 'true' : 'false');
      b.appendChild(el('b', null, String(state.orders.filter(function (o) { return inTab(o, x[0]); }).length)));
      b.addEventListener('click', function () { state.tab = x[0]; render(); }); t.appendChild(b);
    });
  }
  function visible() { var q = state.q.trim().toLowerCase(); return state.orders.filter(function (o) { return inTab(o, state.tab) && matches(o, q); }); }
  function renderList() {
    var list = $('list'); list.textContent = '';
    var rows = visible();
    if (!rows.length) { list.appendChild(el('div', 'empty', state.orders.length ? 'No orders here.' : 'No online orders yet. They will appear here as soon as someone pays.')); return; }
    var table = el('table'), thead = el('thead'), tr = el('tr');
    ['Date', 'Customer', 'Items', 'Delivery', 'Amount', 'Status'].forEach(function (h) { tr.appendChild(el('th', null, h)); });
    thead.appendChild(tr); table.appendChild(thead);
    var tb = el('tbody');
    rows.forEach(function (o) {
      var n = o.notes, s = statusOf(o), r = el('tr');
      r.tabIndex = 0; r.setAttribute('aria-label', 'Open order ' + o.id);
      var c1 = el('td'); c1.appendChild(document.createTextNode(when(o.created))); c1.appendChild(el('span', 'sub', o.id));
      var c2 = el('td'); c2.appendChild(document.createTextNode(n.customer || '(no name)')); c2.appendChild(el('span', 'sub', n.phone || ''));
      var c3 = el('td', 'c-items', (n.items || '').replace(/; /g, ' · '));
      var c4 = el('td'); c4.appendChild(document.createTextNode((n.delivery || '').split(',').slice(0, 2).join(',')));
      var c5 = el('td', 'amt', inr(o.paid || o.amount));
      var c6 = el('td'); c6.appendChild(el('span', 'pill st-' + s, LABEL[s] || s));
      [c1, c2, c3, c4, c5, c6].forEach(function (c) { r.appendChild(c); });
      r.addEventListener('click', function () { openOrder(o.id); });
      r.addEventListener('keydown', function (e) { if (e.key === 'Enter') openOrder(o.id); });
      tb.appendChild(r);
    });
    table.appendChild(tb); list.appendChild(table);
  }
  function renderPrices() {
    var p = $('prices'); p.textContent = '';
    Object.keys(state.products).forEach(function (id) { var x = state.products[id], d = el('div'); d.appendChild(el('b', null, inr(x.price))); d.appendChild(document.createTextNode(x.name + ' · ' + x.pack)); p.appendChild(d); });
    if (state.delivery.fee != null) { var d = el('div'); d.appendChild(el('b', null, inr(state.delivery.fee))); d.appendChild(document.createTextNode('Delivery, free from ' + inr(state.delivery.freeFrom))); p.appendChild(d); }
  }
  function render() { renderKpis(); renderTabs(); renderList(); renderPrices(); }

  /* order detail */
  var current = null, lastFocus = null;
  function kv(dl, k, v) { if (!v) return; dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, v)); }
  function openOrder(id) {
    var o = state.orders.filter(function (x) { return x.id === id; })[0]; if (!o) return;
    current = o; lastFocus = document.activeElement;
    var n = o.notes, s = statusOf(o), p = payOf(o), body = $('d-body'); body.textContent = '';
    $('d-title').textContent = (n.customer || 'Order') + ' · ' + inr(o.paid || o.amount);

    var sec = el('section'); sec.appendChild(el('h3', null, 'Status'));
    var sb = el('div', 'row statusbtns');
    if (s === 'unpaid') sb.appendChild(el('span', 'pill st-unpaid', 'Not paid. Follow up with the customer if needed.'));
    else if (s === 'refunded') sb.appendChild(el('span', 'pill st-refunded', 'Refunded'));
    else ['new', 'packed', 'dispatched', 'delivered', 'cancelled'].forEach(function (x) {
      var b = el('button', 'btn', LABEL[x]); b.type = 'button'; b.setAttribute('aria-pressed', s === x ? 'true' : 'false');
      b.addEventListener('click', function () { save({ status: x }); }); sb.appendChild(b);
    });
    sec.appendChild(sb);
    if (s !== 'unpaid' && s !== 'refunded') {
      var tr = el('div', 'track'), ti = el('input'); ti.placeholder = 'Courier + tracking number'; ti.value = n.tracking || ''; ti.setAttribute('aria-label', 'Tracking number');
      var tbtn = el('button', 'btn btn--primary', 'Save'); tbtn.type = 'button'; tbtn.addEventListener('click', function () { save({ tracking: ti.value }); });
      tr.appendChild(ti); tr.appendChild(tbtn); sec.appendChild(tr);
    }
    body.appendChild(sec);

    sec = el('section'); sec.appendChild(el('h3', null, 'Customer'));
    var dl = el('dl', 'kv'); kv(dl, 'Name', n.customer); kv(dl, 'Phone', n.phone); kv(dl, 'Email', n.email); kv(dl, 'Address', n.address); kv(dl, 'Delivery', n.delivery); kv(dl, 'Note', n.note);
    sec.appendChild(dl);
    var phone = String(n.phone || '').replace(/\D/g, '').slice(-10);
    if (phone) {
      var row = el('div', 'row'); row.style.marginTop = '12px';
      var msg = 'Hi ' + (n.customer || '').split(' ')[0] + ', this is Maika. ' + ({ packed: 'Your order is packed and will be dispatched soon.', dispatched: 'Your order is on its way!' + (n.tracking ? ' Tracking: ' + n.tracking : ''), delivered: 'Hope you are enjoying your order! We would love to hear what you think.' }[s] || 'Thank you for your order. We are preparing it fresh for you.');
      var wa = el('a', 'btn btn--gold', 'WhatsApp customer'); wa.href = 'https://wa.me/91' + phone + '?text=' + encodeURIComponent(msg); wa.target = '_blank'; wa.rel = 'noopener';
      var tel = el('a', 'btn', 'Call'); tel.href = 'tel:+91' + phone;
      row.appendChild(wa); row.appendChild(tel); sec.appendChild(row);
    }
    body.appendChild(sec);

    sec = el('section'); sec.appendChild(el('h3', null, 'Order'));
    dl = el('dl', 'kv'); kv(dl, 'Items', (n.items || '').replace(/; /g, '\n')); kv(dl, 'Subtotal', n.subtotal_inr && inr(n.subtotal_inr)); kv(dl, 'Delivery fee', n.delivery_inr != null && (Number(n.delivery_inr) ? inr(n.delivery_inr) : 'Free'));
    kv(dl, 'Total', inr(o.amount)); kv(dl, 'Placed', when(o.created)); kv(dl, 'Order ID', o.id);
    dl.querySelectorAll('dd').forEach(function (d) { d.style.whiteSpace = 'pre-line'; });
    sec.appendChild(dl); body.appendChild(sec);

    sec = el('section'); sec.appendChild(el('h3', null, 'Payment'));
    if (p) {
      dl = el('dl', 'kv'); kv(dl, 'Payment ID', p.id); kv(dl, 'Status', p.status + (p.refunded ? ' (refunded ' + inr(p.refunded) + ')' : ''));
      kv(dl, 'Method', [p.method, p.vpa, p.bank, p.wallet, p.card].filter(Boolean).join(' · ')); kv(dl, 'Amount', inr(p.amount)); kv(dl, 'Paid at', when(p.created));
      sec.appendChild(dl);
      var prow = el('div', 'row'); prow.style.marginTop = '12px';
      if (p.status === 'authorized') {
        var cap = el('button', 'btn btn--primary', 'Capture ' + inr(p.amount)); cap.type = 'button';
        cap.addEventListener('click', function () { cap.disabled = true; call('capture', { body: { paymentId: p.id, amount: p.amount } }).then(function () { toast('Payment captured'); load(o.id); }).catch(function (e) { cap.disabled = false; toast(e.message); }); });
        prow.appendChild(cap);
      }
      if (p.status === 'captured' && p.refunded < p.amount) {
        var rf = el('button', 'btn btn--danger', 'Refund ' + inr(p.amount - p.refunded)); rf.type = 'button';
        rf.addEventListener('click', function () {
          var typed = window.prompt('This sends ' + inr(p.amount - p.refunded) + ' back to ' + (n.customer || 'the customer') + ' and cannot be undone.\n\nType REFUND to confirm.');
          if (typed !== 'REFUND') { if (typed !== null) toast('Not refunded: you need to type REFUND'); return; }
          rf.disabled = true;
          call('refund', { body: { paymentId: p.id, orderId: o.id, confirm: 'REFUND' } }).then(function (r) { toast('Refund started: ' + inr(r.amount)); load(o.id); }).catch(function (e) { rf.disabled = false; toast(e.message); });
        });
        prow.appendChild(rf);
      }
      var rzp = el('a', 'btn', 'Open in Razorpay'); rzp.href = 'https://dashboard.razorpay.com/app/payments/' + p.id; rzp.target = '_blank'; rzp.rel = 'noopener';
      prow.appendChild(rzp); sec.appendChild(prow);
    } else sec.appendChild(el('p', null, 'No payment attempt yet.'));
    body.appendChild(sec);

    $('shade').hidden = false; $('drawer').hidden = false; $('d-close').focus();
  }
  function closeOrder() { $('shade').hidden = true; $('drawer').hidden = true; current = null; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function save(change) {
    if (!current) return;
    var id = current.id;
    call('update', { body: Object.assign({ orderId: id }, change) }).then(function (r) {
      current.notes = r.notes || current.notes; toast(change.status ? 'Marked ' + LABEL[change.status].toLowerCase() : 'Tracking saved');
      render(); openOrder(id);
    }).catch(function (e) { toast(e.message); });
  }
  $('d-close').addEventListener('click', closeOrder);
  $('shade').addEventListener('click', closeOrder);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('drawer').hidden) closeOrder(); });

  /* CSV */
  $('export').addEventListener('click', function () {
    var rows = [['Date (IST)', 'Order ID', 'Payment ID', 'Customer', 'Phone', 'Email', 'Address', 'Delivery', 'Items', 'Amount', 'Status', 'Tracking', 'Note']];
    visible().forEach(function (o) { var n = o.notes, p = payOf(o); rows.push([when(o.created), o.id, p ? p.id : '', n.customer, n.phone, n.email, n.address, n.delivery, n.items, o.paid || o.amount, LABEL[statusOf(o)], n.tracking, n.note]); });
    var csv = rows.map(function (r) { return r.map(function (c) { c = c == null ? '' : String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'maika-orders-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
  });
  $('search').addEventListener('input', function (e) { state.q = e.target.value; renderList(); });

  /* load, login, logout */
  function load(reopen) {
    $('updated').textContent = 'Loading orders…';
    return call('orders').then(function (d) {
      state.orders = d.orders.sort(function (a, b) { return b.created - a.created; }); state.products = d.products; state.delivery = d.delivery;
      $('updated').textContent = 'Updated ' + new Date(d.fetched).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit' }) + ' IST · ' + state.orders.length + ' orders in Razorpay';
      render(); if (reopen) openOrder(reopen);
    }).catch(function (e) { $('updated').textContent = e.message; });
  }
  function showLogin(msg) { $('app').hidden = true; $('login').hidden = false; $('login-msg').textContent = msg || ''; $('pw').focus(); }
  function showApp(s) { $('login').hidden = true; $('app').hidden = false; var b = $('mode-badge'); b.textContent = s.live ? 'Live' : 'Test'; b.className = 'badge' + (s.live ? '' : ' badge--test'); load(); }
  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault(); $('login-msg').textContent = '';
    var btn = e.target.querySelector('button'); btn.disabled = true;
    call('login', { body: { password: $('pw').value } }).then(function () { $('pw').value = ''; return call('session'); }).then(showApp)
      .catch(function (err) { $('login-msg').textContent = err.message; }).then(function () { btn.disabled = false; });
  });
  $('logout').addEventListener('click', function () { call('logout', { body: {} }).then(function () { showLogin('Logged out.'); }); });
  $('refresh').addEventListener('click', function () { load(); });
  call('session').then(function (s) {
    if (!s.setUp) return showLogin('Admin is not set up yet: add ADMIN_PASSWORD in Vercel (maika-sjco → Settings → Environment Variables) and redeploy.');
    if (s.loggedIn) showApp(s); else showLogin();
  }).catch(function () { showLogin('Could not reach the server.'); });
})();
</script>
</body>
</html>
