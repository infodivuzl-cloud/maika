<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maika</title>
  <meta name="description" content="Maika is coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; margin:0; }
    body { min-height:100vh; display:grid; place-items:center; padding:16px;
           background:#ffffff; color:#000000; text-align:center;
           font-family:'Fredoka', 'Comic Sans MS', system-ui, sans-serif; }
    .brand { font-family:'Luckiest Guy', 'Comic Sans MS', cursive; font-size:clamp(1.5rem, 5vw, 2.25rem);
             letter-spacing:2px; margin-bottom:8px; }
    h1 { font-family:'Luckiest Guy', 'Comic Sans MS', cursive; font-weight:400;
         font-size:clamp(3rem, 14vw, 8rem); line-height:1; letter-spacing:3px;
         display:inline-block; transform:rotate(-3deg); animation:wobble 2.5s ease-in-out infinite; }
    @keyframes wobble { 0%,100% { transform:rotate(-3deg); } 50% { transform:rotate(3deg) scale(1.04); } }
    p { font-size:clamp(1.1rem, 3.5vw, 1.4rem); font-weight:600; max-width:32rem; margin:28px auto 0; }
    footer { margin-top:48px; font-size:.9rem; }
    @media (prefers-reduced-motion: reduce) { h1 { animation:none; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">MAIKA</div>
    <h1>Coming<br>Soon!</h1>
    <p>Something tasty is cooking. Check back soon!</p>
    <footer>&copy; <span id="y"></span> maika.food</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
