<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maika</title>
  <meta name="description" content="Our new website is on the way.">
  <style>
    :root { --bg:#0f172a; --fg:#f8fafc; --muted:#94a3b8; --accent:#38bdf8; }
    * { box-sizing:border-box; margin:0; }
    body { min-height:100vh; display:grid; place-items:center; padding:16px;
           background:radial-gradient(circle at 30% 20%, #1e293b, var(--bg));
           color:var(--fg); font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align:center; }
    h1 { font-size:clamp(2rem, 6vw, 3.5rem); margin-bottom:12px; }
    p { color:var(--muted); font-size:1.1rem; max-width:32rem; margin:0 auto 24px; }
    .dot { color:var(--accent); }
    a.btn { display:inline-block; padding:12px 24px; border-radius:999px; background:var(--accent);
            color:var(--bg); font-weight:600; text-decoration:none; }
    footer { margin-top:40px; font-size:.85rem; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Maika is coming<span class="dot">.</span></h1>
    <p>We're building our new website. Check back soon!</p>
    <a class="btn" href="mailto:hello@example.com">Contact us</a>
    <footer>&copy; <span id="y"></span> All rights reserved.</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
